<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chat Debug</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; }
        .container { max-width: 800px; margin: auto; background: #f9f9f9; padding: 20px; border-radius: 8px; box-shadow: 0 0 10px rgba(0,0,0,0.1); }
        h1 { color: #333; }
        .chat-area { border: 1px solid #ccc; height: 400px; overflow-y: scroll; padding: 10px; background: #fff; margin-bottom: 10px; }
        .message { margin-bottom: 10px; }
        .user-message { text-align: right; color: blue; }
        .ai-message { text-align: left; color: green; }
        .input-area { display: flex; }
        .input-area input { flex-grow: 1; padding: 8px; border: 1px solid #ccc; border-radius: 4px; margin-right: 10px; }
        .input-area button { padding: 8px 15px; background: #007bff; color: white; border: none; border-radius: 4px; cursor: pointer; }
        .input-area button:hover { background: #0056b3; }
        .context-area { margin-top: 20px; border-top: 1px solid #eee; padding-top: 15px; }
        .context-item { background: #e9e9e9; padding: 8px; border-radius: 4px; margin-bottom: 5px; font-size: 0.9em; }
    </style>
</head>
<body>
    <div class="container">
        <h1>Chat Debug Interface</h1>
        <div class="chat-area" id="chat-area">
            <!-- Chat messages will be appended here -->
        </div>
        <form id="chat-form" onsubmit="sendMessage(event); return false;">
            {% csrf_token %}
            <div class="input-area">
                <input type="text" id="user-input" placeholder="Type your message...">
                <button type="submit">Send</button>
            </div>
        </form>
        <div class="context-area">
            <h2>Context Chunks</h2>
            <div id="context-chunks">
                <!-- Context chunks will be displayed here -->
            </div>
        </div>
    </div>

    <script>
        async function sendMessage(event) {
            event.preventDefault(); // Prevent default form submission
            const userInput = document.getElementById('user-input');
            const chatArea = document.getElementById('chat-area');
            const contextChunksDiv = document.getElementById('context-chunks');
            const message = userInput.value.trim();
            const csrfToken = document.querySelector('#chat-form input[name="csrfmiddlewaretoken"]').value;

            if (!message) return;

            // Display user message
            const userMessageDiv = document.createElement('div');
            userMessageDiv.classList.add('message', 'user-message');
            userMessageDiv.textContent = `You: ${message}`;
            chatArea.appendChild(userMessageDiv);

            userInput.value = ''; // Clear input

            // Simulate AI response
            const aiMessageDiv = document.createElement('div');
            aiMessageDiv.classList.add('message', 'ai-message');
            aiMessageDiv.textContent = 'AI: Thinking...';
            chatArea.appendChild(aiMessageDiv);
            chatArea.scrollTop = chatArea.scrollHeight; // Scroll to bottom

            try {
                const payload = new URLSearchParams({
                    'pdf_id': 1, // Assuming a default PDF ID for debug
                    'query': message,
                    'csrfmiddlewaretoken': csrfToken
                });

                console.log('Sending POST request to:', '/chat_app/chat/');
                console.log('Payload:', payload.toString());

                const response = await fetch('/chat_app/chat/', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/x-www-form-urlencoded',
                        'X-CSRFToken': csrfToken // Use the CSRF token from the hidden input
                    },
                    body: payload
                });
                const data = await response.json();

                if (data.status === 'success') {
                    aiMessageDiv.textContent = `AI: ${data.answer}`;
                    
                    // Display context chunks
                    contextChunksDiv.innerHTML = ''; // Clear previous chunks
                    data.context.forEach(chunk => {
                        const chunkDiv = document.createElement('div');
                        chunkDiv.classList.add('context-item');
                        chunkDiv.innerHTML = `<strong>Page ${chunk.page} (Source: ${chunk.source}):</strong> ${chunk.content}`;
                        contextChunksDiv.appendChild(chunkDiv);
                    });

                } else {
                    aiMessageDiv.textContent = `AI: Error - ${data.message}`;
                }
            } catch (error) {
                console.error('Error:', error);
                aiMessageDiv.textContent = `AI: Error - Could not connect to server.`;
            }
            chatArea.scrollTop = chatArea.scrollHeight; // Scroll to bottom
        }

        // The getCookie function is no longer strictly needed if we rely on {% csrf_token %}
        // but keeping it for reference or if other parts of the app still use it.

        //     let cookieValue = null;

        //         for (let i = 0; i < cookies.length; i++) {
        //             const cookie = cookies[i].trim();
        //             if (cookie.substring(0, name.length + 1) === (name + '=')) {
        //                 cookieValue = decodeURIComponent(cookie.substring(name.length + 1));
        //                 break;
        //             }
        //         }
        //     }
        //     return cookieValue;
        // }
    </script>
</body>
</html>
